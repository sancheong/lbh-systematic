[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lbh"
version = "0.3.0"
description = "Local-Browser-Hybrid context broker for repo-aware code repair workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LBH" }]
license = { text = "MIT" }
keywords = ["context-engineering", "repo-index", "diff", "code-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Software Development"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lbh = "lbh.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
